version: 2

project_name: eggl-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: eggl
    main: .
    binary: eggl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Robert27/eggl-cli/cmd.version={{ .Tag }}
      - -X github.com/Robert27/eggl-cli/cmd.commit={{ .ShortCommit }}
      - -X github.com/Robert27/eggl-cli/cmd.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: eggl
    ids:
      - eggl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: Robert27
    name: eggl-cli

brews:
  - name: eggl-cli
    ids:
      - eggl
    repository:
      owner: Robert27
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Robert27/eggl-cli"
    description: "General-purpose helper CLI"
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    install: |
      bin.install "eggl"
    test: |
      assert_match "v{{ .Version }}", shell_output("#{bin}/eggl version --short")
    custom_block: |
      head "https://github.com/Robert27/eggl-cli.git", branch: "main"
