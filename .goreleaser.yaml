version: 2

project_name: eggl-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: eggl
    main: .
    binary: eggl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/roberteggl/eggl-cli/cmd.version={{ .Tag }}
      - -X github.com/roberteggl/eggl-cli/cmd.commit={{ .ShortCommit }}
      - -X github.com/roberteggl/eggl-cli/cmd.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: eggl
    ids:
      - eggl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: roberteggl
    name: eggl-cli

brews:
  - name: eggl-cli
    ids:
      - eggl
    directory: Formula
    repository:
      owner: roberteggl
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/roberteggl/eggl-cli"
    description: "General-purpose helper CLI"
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    extra_install: |
      generate_completions_from_executable(bin/"eggl", shells: [:bash, :zsh, :fish], shell_parameter_format: :cobra)
    post_install: |
      if OS.mac?
        system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{bin}/eggl"], sudo: false
      end
